spring.jpa.show-sql=true
# 쿼리를 보기 편하게 포맷팅 (추가)
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

